services:
  - type: web
    name: nodues-flow-ai
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -k eventlet -w 1 'app:create_app("production")'
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nodues-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://SmartNoDue.in
      - key: PYTHONPATH
        value: .

databases:
  - name: nodues-db
    plan: free

