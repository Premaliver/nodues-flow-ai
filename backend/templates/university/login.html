<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Leadership Login — Smart NoDues SaaS</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #EC4899 100%);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(226, 232, 240, 0.8);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(238, 242, 255, 0.9) 0%, rgba(245, 243, 255, 0.8) 50%, rgba(253, 242, 248, 0.9) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: #1E293B;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.6);
        }
        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .brand-logo {
            width: 52px;
            height: 52px;
            background: var(--brand-gradient);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-bottom: 1rem;
            box-shadow: 0 12px 20px -6px rgba(79, 70, 229, 0.45);
        }
        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0F172A;
            letter-spacing: -0.02em;
        }
        .brand-subtitle {
            font-size: 0.875rem;
            color: #64748B;
            margin-top: 0.25rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .form-label {
            font-size: 0.825rem;
            font-weight: 600;
            color: #334155;
        }
        .form-control {
            padding: 0.8rem 1rem;
            border: 1px solid #CBD5E1;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background: #F8FAFC;
            color: #0F172A;
        }
        .form-control:focus {
            outline: none;
            border-color: #6366F1;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }
        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background: var(--brand-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 0.5rem;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.5);
        }
        .footer-links {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.875rem;
            color: #64748B;
        }
        .footer-links a {
            color: #4F46E5;
            font-weight: 600;
            text-decoration: none;
        }
        .alert-error {
            padding: 0.75rem 1rem;
            background: #FEF2F2;
            border: 1px solid #FCA5A5;
            color: #991B1B;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-header">
        <div class="brand-logo">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        </div>
        <h1 class="brand-title">University Portal</h1>
        <p class="brand-subtitle">Institutional Leadership & Subscription Management</p>
    </div>

    <div id="alertBox" class="alert-error" {% if error %}style="display: block;"{% endif %}>{{ error if error else '' }}</div>

    <form id="univLoginForm" onsubmit="handleLogin(event); return false;">
        <div class="form-group">
            <label class="form-label" for="email">Official Institutional Email</label>
            <input type="email" id="email" class="form-control" placeholder="registrar@university.edu" required autocomplete="email">
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Sign In to University Portal</button>
    </form>

    <div class="footer-links">
        Don't have an institutional account yet?<br>
        <a href="/university/register">Register Your University Here &rarr;</a>
    </div>
</div>

<script>
async function handleLogin(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (e && e.stopPropagation) e.stopPropagation();

    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    alertBox.style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
        alertBox.textContent = "Please enter both official email and password.";
        alertBox.style.display = 'block';
        return false;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Verifying Account...';

    try {
        const response = await fetch('/university/login', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({ email, password })
        });

        let data;
        const responseText = await response.text();
        try {
            data = JSON.parse(responseText);
        } catch (jsonErr) {
            console.error("Non-JSON Server response:", responseText);
            data = { success: false, message: "Server response error. Please try again." };
        }

        if (response.ok && data.success) {
            window.location.href = (data.data && data.data.redirect_url) ? data.data.redirect_url : '/university/dashboard';
        } else {
            alertBox.textContent = data.message || "Invalid email or password. Please verify your credentials.";
            alertBox.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In to University Portal';
        }
    } catch (err) {
        console.error("Login Exception:", err);
        alertBox.textContent = "Unable to reach server. Please check your connection and try again.";
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to University Portal';
    }

    return false;
}
</script>

<!-- PLATFORM MASTER SUPERADMIN SECRET MODAL -->
<div id="masterAdminModalBackdrop" style="position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(5, 8, 22, 0.88); backdrop-filter: blur(16px); z-index: 9999; padding: 1rem;">
    <div style="background: #0d1127; border: 1px solid rgba(99, 102, 241, 0.4); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85); width: 100%; max-width: 440px; border-radius: 24px; padding: 2.25rem; position: relative; box-sizing: border-box;">
        <button type="button" onclick="closeMasterAdminModal()" title="Close" style="position: absolute; top: 1.25rem; right: 1.25rem; background: none; border: none; font-size: 1.5rem; color: #94a3b8; cursor: pointer;">&times;</button>
        
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 0.85rem; box-shadow: 0 0 25px rgba(99, 102, 241, 0.6);">
                👑
            </div>
            <h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.45rem; font-weight: 700; color: #fff; margin: 0 0 0.25rem; letter-spacing: -0.02em;">
                Master Platform Controller
            </h3>
            <div style="display: inline-block; font-size: 0.72rem; font-weight: 700; color: #06b6d4; text-transform: uppercase; letter-spacing: 0.08em; background: rgba(6, 182, 212, 0.12); padding: 0.25rem 0.65rem; border-radius: 100px; border: 1px solid rgba(6, 182, 212, 0.3);">
                ⚡ Platform SuperAdmin Access
            </div>
        </div>

        <div id="masterAdminAlert" style="display: none; padding: 0.75rem 1rem; border-radius: 10px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; font-size: 0.82rem; margin-bottom: 1rem;"></div>

        <form id="masterAdminForm" onsubmit="handleMasterAdminLogin(event)">
            <div style="margin-bottom: 1.25rem;">
                <label for="masterUsername" style="color: #cbd5e1; font-weight: 600; font-size: 0.82rem; display:block; margin-bottom:0.4rem;">Master Operator ID</label>
                <input type="text" id="masterUsername" value="PREMK" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(15, 23, 42, 0.9); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; font-size: 0.9rem; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label for="masterPassword" style="color: #cbd5e1; font-weight: 600; font-size: 0.82rem; display:block; margin-bottom:0.4rem;">Master Security Key</label>
                <input type="password" id="masterPassword" placeholder="••••••••" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(15, 23, 42, 0.9); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; font-size: 0.9rem; box-sizing: border-box;">
            </div>

            <button type="submit" id="masterLoginBtn" style="width: 100%; padding: 0.85rem; font-size: 0.95rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); cursor: pointer;">
                ⚡ Authenticate as Master SuperAdmin
            </button>
        </form>
    </div>
</div>

<script>
function openMasterAdminModal() {
    const modal = document.getElementById('masterAdminModalBackdrop');
    if (modal) {
        modal.style.display = 'flex';
        document.getElementById('masterPassword').focus();
    }
}

function closeMasterAdminModal() {
    const modal = document.getElementById('masterAdminModalBackdrop');
    if (modal) modal.style.display = 'none';
}

async function handleMasterAdminLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('masterLoginBtn');
    const alertBox = document.getElementById('masterAdminAlert');
    alertBox.style.display = 'none';

    const username = document.getElementById('masterUsername').value.trim();
    const password = document.getElementById('masterPassword').value;

    btn.disabled = true;
    btn.textContent = 'Verifying Master Credentials...';

    try {
        const res = await fetch('/platform/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
            btn.textContent = 'Access Granted! Launching...';
            if (data.data && data.data.access_token) {
                localStorage.setItem('access_token', data.data.access_token);
            }
            setTimeout(() => {
                window.location.href = data.data.redirect_url || '/platform/dashboard';
            }, 400);
        } else {
            alertBox.textContent = data.message || 'Invalid Master SuperAdmin credentials.';
            alertBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = '⚡ Authenticate as Master SuperAdmin';
        }
    } catch (err) {
        alertBox.textContent = 'Unable to reach server. Please check connection.';
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '⚡ Authenticate as Master SuperAdmin';
    }
}

// Global Secret Shortcut: Ctrl + Shift + P
document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey && e.shiftKey && (e.key === 'P' || e.key === 'p' || e.key === 'A' || e.key === 'a')) || (e.altKey && (e.key === 's' || e.key === 'S'))) {
        e.preventDefault();
        openMasterAdminModal();
    }
});
</script>

</body>
</html>
