<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — Smart NoDues AI</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .password-strength { height: 4px; border-radius: var(--radius-full); margin-top: 0.5rem; transition: all var(--transition-base); }
        .password-strength.weak { background: var(--crimson); width: 33%; }
        .password-strength.medium { background: var(--amber); width: 66%; }
        .password-strength.strong { background: var(--emerald); width: 100%; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; opacity: 0; }
        .del-1 { animation-delay: 0.1s; } .del-2 { animation-delay: 0.2s; } .del-3 { animation-delay: 0.3s; } .del-4 { animation-delay: 0.4s; }
        @media (max-width: 480px) {
            body > div[style*="padding: 2rem"] { padding: 1rem !important; }
            .card { padding: 1.5rem !important; border-radius: var(--radius-xl) !important; }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="floating-shape floating-shape-1"></div>
        <div class="floating-shape floating-shape-4"></div>
    </div>

    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-primary); padding: 2rem;">
        <div class="card animate-in del-1" style="max-width: 480px; width: 100%; padding: 2.5rem; box-shadow: var(--shadow-xl);">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 64px; height: 64px; border-radius: 16px; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.5rem; margin: 0 auto 1rem; font-family: 'DM Serif Display', serif;">🔐</div>
                <h1 style="font-family: 'DM Serif Display', serif; font-size: 1.5rem; font-weight: 400; margin-bottom: 0.35rem;">Change Password</h1>
                <p style="color: var(--text-muted); font-size: 0.875rem;">Enter your current password and choose a new one</p>
            </div>

            <div id="errorMessage" style="display: none; background: var(--crimson-soft); color: var(--crimson); padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; font-size: 0.85rem;"></div>
            <div id="successMessage" style="display: none; background: var(--emerald-soft); color: var(--emerald); padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; font-size: 0.85rem;"></div>

            <form id="changePasswordForm" onsubmit="return changePassword(event)" class="animate-in del-2">
                <div class="form-group">
                    <label class="form-label" for="current_password">Current Password</label>
                    <input type="password" id="current_password" name="current_password" class="form-input" placeholder="Enter current password" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" class="form-input" placeholder="Min. 8 characters" required minlength="8">
                    <div class="password-strength" id="passwordStrength"></div>
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">Min 8 characters, 1 uppercase, 1 lowercase, 1 number</p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;" id="submitBtn">Change Password</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('new_password').addEventListener('input', function() {
            const val = this.value;
            const bar = document.getElementById('passwordStrength');
            if (val.length === 0) { bar.className = 'password-strength'; bar.style.width = '0'; return; }
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[a-z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            if (score <= 2) { bar.className = 'password-strength weak'; }
            else if (score <= 3) { bar.className = 'password-strength medium'; }
            else { bar.className = 'password-strength strong'; }
        });

        async function changePassword(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errEl = document.getElementById('errorMessage');
            const sucEl = document.getElementById('successMessage');
            errEl.style.display = 'none';
            sucEl.style.display = 'none';

            const current = document.getElementById('current_password').value;
            const newPass = document.getElementById('new_password').value;
            const confirm = document.getElementById('confirm_password').value;

            if (newPass !== confirm) {
                errEl.textContent = 'New passwords do not match';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Changing...';

            try {
                const res = await fetch('/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        current_password: current,
                        new_password: newPass,
                        confirm_password: confirm,
                    }),
                });
                const data = await res.json();
                if (data.success) {
                    sucEl.textContent = data.message + ' ✓';
                    sucEl.style.display = 'block';
                    setTimeout(() => { window.location.href = data.data.redirect_url || '/'; }, 1500);
                } else {
                    errEl.textContent = data.message;
                    errEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Change Password';
                }
            } catch (e) {
                errEl.textContent = 'An error occurred. Please try again.';
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Change Password';
            }
            return false;
        }
    </script>
</body>
</html>
