<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Smart NoDues AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Password wrapper and toggle button */
        .password-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .password-input-wrap .form-input {
            padding-right: 3rem !important;
            width: 100%;
        }
        .password-toggle-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0.4rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
            z-index: 5;
            line-height: 1;
        }
        .password-toggle-btn:hover {
            color: var(--accent);
            background: rgba(99, 102, 241, 0.08);
        }
        .password-toggle-btn:focus {
            outline: none;
            color: var(--accent);
        }

        /* Sophisticated Bottom Status Alert */
        .status-alert-box {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.95rem 1.15rem;
            border-radius: var(--radius-lg);
            font-size: 0.875rem;
            margin-top: 1rem;
            margin-bottom: 0.75rem;
            border: 1.5px solid transparent;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            backdrop-filter: blur(12px);
        }
        .status-alert-box.error {
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.28);
            color: #b91c1c;
            animation: alertShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }
        .status-alert-box.success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #047857;
            animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .status-alert-box .alert-icon {
            font-size: 1.25rem;
            line-height: 1;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .status-alert-box .alert-content {
            flex: 1;
        }
        .status-alert-box .alert-title {
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 0.15rem;
            letter-spacing: -0.01em;
        }
        .status-alert-box .alert-desc {
            font-size: 0.825rem;
            opacity: 0.95;
            line-height: 1.45;
        }

        /* Field Invalid state */
        .form-input.is-invalid, .form-select.is-invalid {
            border-color: #ef4444 !important;
            background-color: rgba(239, 68, 68, 0.02) !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15) !important;
        }

        @keyframes alertShake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-in { animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; opacity: 0; }
        .del-1 { animation-delay: 0.1s; } 
        .del-2 { animation-delay: 0.2s; } 
        .del-3 { animation-delay: 0.3s; }
        .del-4 { animation-delay: 0.4s; } 
        .del-5 { animation-delay: 0.5s; }

        @media (max-width: 480px) {
            body > div[style*="padding: 2rem"] { padding: 1rem !important; }
            .card { padding: 1.5rem !important; border-radius: var(--radius-xl) !important; }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="floating-shape floating-shape-1"></div>
        <div class="floating-shape floating-shape-3"></div>
        <div class="floating-shape floating-shape-5"></div>
    </div>

    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">
        <div style="width: 100%; max-width: 560px;">
            <div class="card" style="padding: 2.5rem; box-shadow: var(--shadow-xl);">
                <div class="animate-in del-1" style="text-align: center; margin-bottom: 2rem;">
                    <div style="width: 48px; height: 48px; border-radius: 14px; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.5rem; margin: 0 auto 1rem; font-family: 'DM Serif Display', serif;">S</div>
                    <h1 style="font-family: 'DM Serif Display', serif; font-size: 1.5rem; font-weight: 400; margin-bottom: 0.35rem;">Create Account</h1>
                    <p style="color: var(--text-muted); font-size: 0.875rem;">Register as a student</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm" class="animate-in del-3" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="first_name">First Name *</label>
                            <input type="text" id="first_name" name="first_name" class="form-input" placeholder="Your first name" autocomplete="given-name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="last_name">Last Name *</label>
                            <input type="text" id="last_name" name="last_name" class="form-input" placeholder="Your last name" autocomplete="family-name" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email Address *</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="example@gmail.com" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" class="form-input" placeholder="+91" autocomplete="tel">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password *</label>
                        <div class="password-input-wrap">
                            <input type="password" id="password" name="password" class="form-input" placeholder="Min. 8 characters" autocomplete="new-password" required>
                            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" onclick="togglePasswordVisibility('password', this)" title="Show / Hide Password" aria-label="Show password">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <small style="display: block; margin-top: 0.35rem; font-size: 0.76rem; color: var(--text-muted);">Must be at least 8 characters</small>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="father_name">Father's Name</label>
                            <input type="text" id="father_name" name="father_name" class="form-input" placeholder="Father's full name" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="father_phone">Father's Phone No</label>
                            <input type="tel" id="father_phone" name="father_phone" class="form-input" placeholder="+91" autocomplete="tel">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="roll_number">Roll Number *</label>
                            <input type="text" id="roll_number" name="roll_number" class="form-input" placeholder="e.g. 123456789" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="enrollment_number">Enrollment Number *</label>
                            <input type="text" id="enrollment_number" name="enrollment_number" class="form-input" placeholder="e.g. RBU12345678" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="course_name">Course *</label>
                        <select class="form-select" id="course_name" name="course_name" onchange="updateSemesters()" required>
                            <option value="">— Select your course —</option>
                            <option value="B.Tech Computer Science Engineering">B.Tech CSE</option>
                            <option value="B.Tech Electronics & Communication Engineering">B.Tech ECE</option>
                            <option value="B.Tech Mechanical Engineering">B.Tech ME</option>
                            <option value="B.Tech Civil Engineering">B.Tech CE</option>
                            <option value="B.Tech Information Technology">B.Tech IT</option>
                            <option value="B.Tech Artificial Intelligence & ML">B.Tech AI & ML</option>
                            <option value="B.Tech Data Science">B.Tech Data Science</option>
                            <option value="BBA">BBA</option>
                            <option value="MBA">MBA</option>
                            <option value="BCA">BCA</option>
                            <option value="MCA">MCA</option>
                            <option value="B.Pharm">B.Pharm</option>
                            <option value="B.Sc Nursing">B.Sc Nursing</option>
                            <option value="BPT">BPT</option>
                            <option value="B.Ed">B.Ed</option>
                            <option value="B.Sc Biotechnology">B.Sc Biotechnology</option>
                            <option value="BJMC">BJMC</option>
                            <option value="BHM">BHM</option>
                            <option value="BFA">BFA</option>
                            <option value="LLB">LLB</option>
                            <option value="BA LLB">BA LLB</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="branch">Branch</label>
                            <input type="text" id="branch" name="branch" class="form-input" placeholder="e.g. CSE">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="current_semester">Current Semester *</label>
                            <select class="form-select" id="current_semester" name="current_semester" required>
                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                                <option value="5">Semester 5</option>
                                <option value="6" selected>Semester 6</option>
                                <option value="7">Semester 7</option>
                                <option value="8">Semester 8</option>
                                <option value="9">Semester 9</option>
                                <option value="10">Semester 10</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="batch_year">Batch Year</label>
                            <input type="text" id="batch_year" name="batch_year" class="form-input" placeholder="e.g. 2022-2026">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="admission_year">Admission Year</label>
                            <input type="number" id="admission_year" name="admission_year" class="form-input" placeholder="e.g. 2022" min="2000" max="2030">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="category">Category</label>
                        <select class="form-select" id="category" name="category">
                            <option value="day_scholar">Day Scholar</option>
                            <option value="hosteller">Hosteller</option>
                        </select>
                    </div>

                    <!-- Sophisticated Status & Warning Notification Area at the Bottom -->
                    <div id="bottomAlert" class="status-alert-box" style="display: none;" role="alert">
                        <div class="alert-icon" id="alertIcon">⚠️</div>
                        <div class="alert-content">
                            <div class="alert-title" id="alertTitle">Action Required</div>
                            <div class="alert-desc" id="alertMessage">Please review and complete the highlighted details.</div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary btn-lg" style="width: 100%; padding: 0.85rem; font-size: 0.95rem; margin-top: 0.5rem;">
                        Create Account
                    </button>
                </form>

                <div class="animate-in del-5" style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light);">
                    <p style="font-size: 0.85rem; color: var(--text-muted);">
                        Already have an account?
                        <a href="{{ url_for('auth.login') }}" style="font-weight: 600; color: var(--accent);">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Password Visibility Toggle
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
            btn.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
            
            if (isPassword) {
                // Eye slash icon (hide)
                btn.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                `;
            } else {
                // Eye icon (show)
                btn.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                `;
            }
        }

        // Show sophisticated bottom warning/success alert
        function showBottomAlert(type, title, message) {
            const alertBox = document.getElementById('bottomAlert');
            const alertIcon = document.getElementById('alertIcon');
            const alertTitle = document.getElementById('alertTitle');
            const alertMessage = document.getElementById('alertMessage');

            alertBox.className = 'status-alert-box ' + type;
            alertTitle.textContent = title;
            alertMessage.textContent = message;

            if (type === 'error') {
                alertIcon.textContent = '⚠️';
            } else if (type === 'success') {
                alertIcon.textContent = '✅';
            } else {
                alertIcon.textContent = 'ℹ️';
            }

            alertBox.style.display = 'flex';

            // Auto-scroll directly to the alert box so user never has to scroll up
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function hideBottomAlert() {
            const alertBox = document.getElementById('bottomAlert');
            alertBox.style.display = 'none';
        }

        // Remove invalid highlights on typing/selection
        document.querySelectorAll('.form-input, .form-select').forEach(el => {
            el.addEventListener('input', () => {
                el.classList.remove('is-invalid');
                hideBottomAlert();
            });
            el.addEventListener('change', () => {
                el.classList.remove('is-invalid');
                hideBottomAlert();
            });
        });

        function updateSemesters() {
            const course = document.getElementById('course_name').value;
            const semSelect = document.getElementById('current_semester');
            semSelect.innerHTML = '';
            let maxSem = 8;
            if (course.includes('B.Tech')) maxSem = 8;
            else if (course.includes('MBA') || course.includes('MCA')) maxSem = 4;
            else if (course.includes('BBA') || course.includes('BCA') || course.includes('B.Sc') || course.includes('B.Ed') || course.includes('BFA')) maxSem = 6;
            else if (course.includes('BA LLB')) maxSem = 10;
            else if (course.includes('LLB')) maxSem = 6;
            else if (course.includes('BHM') || course.includes('BJMC')) maxSem = 6;
            else if (course.includes('B.Pharm')) maxSem = 8;
            else if (course.includes('BPT')) maxSem = 8;
            else if (course.includes('B.Sc Nursing')) maxSem = 8;
            for (let i = 1; i <= maxSem; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Semester ${i}`;
                semSelect.appendChild(opt);
            }
        }
        updateSemesters();

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideBottomAlert();

            // Client-side pre-validation
            const firstName = document.getElementById('first_name');
            const lastName = document.getElementById('last_name');
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const rollNumber = document.getElementById('roll_number');
            const enrollmentNumber = document.getElementById('enrollment_number');
            const courseName = document.getElementById('course_name');

            let firstInvalidField = null;

            function markInvalid(field) {
                field.classList.add('is-invalid');
                if (!firstInvalidField) firstInvalidField = field;
            }

            if (!firstName.value.trim()) markInvalid(firstName);
            if (!lastName.value.trim()) markInvalid(lastName);
            if (!email.value.trim() || !email.value.includes('@')) markInvalid(email);
            if (!password.value || password.value.length < 8) markInvalid(password);
            if (!rollNumber.value.trim()) markInvalid(rollNumber);
            if (!enrollmentNumber.value.trim()) markInvalid(enrollmentNumber);
            if (!courseName.value) markInvalid(courseName);

            if (firstInvalidField) {
                if (firstInvalidField === password && password.value.length > 0 && password.value.length < 8) {
                    showBottomAlert('error', 'Weak Password', 'Password must be at least 8 characters long.');
                } else if (firstInvalidField === email && email.value.trim()) {
                    showBottomAlert('error', 'Invalid Email', 'Please provide a valid email address.');
                } else {
                    showBottomAlert('error', 'Missing Information', 'Please fill in all the required fields highlighted in red.');
                }
                firstInvalidField.focus();
                return;
            }

            const btn = document.getElementById('submitBtn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.innerHTML = '<span style="display: inline-flex; align-items: center; gap: 0.5rem;">Creating account...</span>';

            try {
                const csrfToken = document.querySelector('input[name="csrf_token"]')?.value || '';
                const res = await fetch(this.action, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    body: JSON.stringify({
                        first_name: firstName.value.trim(),
                        last_name: lastName.value.trim(),
                        email: email.value.trim(),
                        phone: document.getElementById('phone').value.trim(),
                        password: password.value,
                        roll_number: rollNumber.value.trim(),
                        enrollment_number: enrollmentNumber.value.trim(),
                        course_name: courseName.value,
                        branch: document.getElementById('branch').value.trim(),
                        current_semester: parseInt(document.getElementById('current_semester').value),
                        batch_year: document.getElementById('batch_year').value.trim(),
                        admission_year: parseInt(document.getElementById('admission_year').value) || new Date().getFullYear(),
                        category: document.getElementById('category').value,
                        father_name: document.getElementById('father_name').value.trim(),
                        father_phone: document.getElementById('father_phone').value.trim(),
                    })
                });

                const data = await res.json();

                if (data.success) {
                    showBottomAlert('success', 'Account Created Successfully! 🎉', 'Your registration is complete. Redirecting you to sign in...');
                    btn.textContent = 'Redirecting...';
                    setTimeout(() => window.location.href = '/auth/login', 1800);
                } else {
                    const errorMsg = data.message || 'Registration failed. Please check your details.';
                    showBottomAlert('error', 'Registration Notice', errorMsg);

                    // Highlight related field if message hints at it
                    const lowerMsg = errorMsg.toLowerCase();
                    if (lowerMsg.includes('email')) markInvalid(email);
                    if (lowerMsg.includes('roll')) markInvalid(rollNumber);
                    if (lowerMsg.includes('password')) markInvalid(password);

                    btn.disabled = false;
                    btn.textContent = originalText;
                }
            } catch (error) {
                showBottomAlert('error', 'Network Connection Error', 'Unable to connect to the server. Please check your connection and try again.');
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
