<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Smart NoDues AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; }
        .login-card { width: 100%; max-width: 420px; }
        .role-select-wrap { position: relative; }
        .role-select-wrap select {
            width: 100%; padding: 0.85rem 1.25rem; padding-right: 2.5rem;
            border: 1.5px solid var(--border-light); border-radius: var(--radius-lg);
            background: var(--bg-card); color: var(--text-primary);
            font-family: var(--font-sans); font-size: 0.9rem; font-weight: 500;
            appearance: none; -webkit-appearance: none; -moz-appearance: none;
            cursor: pointer; transition: all var(--transition-fast);
            outline: none; box-shadow: var(--shadow-sm);
        }
        .role-select-wrap select:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }
        .role-select-wrap::after {
            content: '▾'; position: absolute; right: 1.25rem; top: 50%; transform: translateY(-50%);
            font-size: 0.8rem; color: var(--text-muted); pointer-events: none;
        }
        .error-msg { color: var(--crimson); font-size: 0.85rem; text-align: center; margin-bottom: 1.25rem; display: none; padding: 0.75rem; background: var(--crimson-soft); border-radius: var(--radius-md); }
        .form-input-icon { position: relative; }
        .form-input-icon .icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1rem; }
        .form-input-icon .form-input { padding-left: 2.75rem; }
        .floating-label { position: absolute; left: 2.75rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; pointer-events: none; transition: all var(--transition-fast); background: var(--bg-card); padding: 0 4px; }
        .form-input-icon .form-input:focus + .floating-label,
        .form-input-icon .form-input:not(:placeholder-shown) + .floating-label { top: 0; transform: translateY(-50%); font-size: 0.7rem; color: var(--accent); }
        .input-focused .floating-label { top: 0; transform: translateY(-50%); font-size: 0.7rem; color: var(--accent); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .del-1 { animation-delay: 0.1s; }
        .del-2 { animation-delay: 0.2s; }
        .del-3 { animation-delay: 0.3s; }
        .del-4 { animation-delay: 0.4s; }
        .del-5 { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="floating-shape floating-shape-1"></div>
        <div class="floating-shape floating-shape-2"></div>
        <div class="floating-shape floating-shape-4"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="card" style="padding: 2.5rem; box-shadow: var(--shadow-xl);">
                <!-- Brand -->
                <div class="animate-in del-1" id="brandLogo" style="text-align: center; margin-bottom: 1.5rem; cursor: pointer;" title="Triple click to toggle hidden admin mode">
                    <div style="width: 48px; height: 48px; border-radius: 14px; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.5rem; margin: 0 auto 0.75rem; font-family: 'DM Serif Display', serif;">S</div>
                    <h1 style="font-family: 'DM Serif Display', serif; font-size: 1.5rem; font-weight: 400; margin-bottom: 0.35rem;">Welcome Back</h1>
                    <p style="color: var(--text-muted); font-size: 0.875rem;">Sign in to your account</p>
                </div>

                <div id="secretAdminBanner" style="display:none; text-align:center; padding:0.5rem; margin-bottom:1rem; background:linear-gradient(135deg, #6366f1, #8b5cf6); color:white; font-size:0.75rem; font-weight:700; border-radius:var(--radius-md); letter-spacing:0.05em; text-transform:uppercase; box-shadow:var(--shadow-glow);">
                    🔐 SECRET SUPER ADMIN LOGGER UNLOCKED
                </div>

                <div id="errorMsg" class="error-msg animate-in del-2"></div>

                <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm" class="animate-in del-3">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="form-group">
                        <label class="form-label" for="roleSelect">I am a</label>
                        <div class="role-select-wrap">
                            <select id="roleSelect" name="role" required>
                                <option value="">— Select your role —</option>
                                <optgroup label="Student">
                                    <option value="student">🎓 Student</option>
                                </optgroup>
                                <optgroup label="Department Staff">
                                    <option value="accounts">💰 Accounts</option>
                                    <option value="hostel">🏠 Hostel</option>
                                    <option value="mess">🍽️ Mess</option>
                                    <option value="transport">🚌 Transport</option>
                                    <option value="scholarship">📜 Scholarship</option>
                                    <option value="hod">📚 HOD</option>
                                    <option value="examination">📝 Examination</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" id="emailField">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="form-input-icon">
                            <span class="icon">✉️</span>
                            <input type="email" id="email" name="email" class="form-input" placeholder="you@rayatbahra.edu" autocomplete="email" required>
                        </div>
                    </div>

                    <div class="form-group" id="usernameField" style="display: none;">
                        <label class="form-label" for="username">Username</label>
                        <div class="form-input-icon">
                            <span class="icon">👤</span>
                            <input type="text" id="username" name="username" class="form-input" placeholder="Enter Super Admin username" autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="form-input-icon">
                            <span class="icon">🔒</span>
                            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
                        </div>
                    </div>

                    <div class="form-group" style="display: flex; align-items: center; gap: 0.75rem;">
                        <input type="checkbox" id="remember" name="remember" style="width: 16px; height: 16px; accent-color: var(--accent); border-radius: 4px;">
                        <label for="remember" style="font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; padding: 0.85rem; font-size: 0.95rem;">
                        Sign In
                    </button>
                </form>

                <div class="animate-in del-5" style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light);">
                    <p style="font-size: 0.85rem; color: var(--text-muted);">
                        Don't have an account?
                        <a href="{{ url_for('auth.register') }}" style="font-weight: 600; color: var(--accent);">Create one</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function enableSuperAdminMode() {
            const roleSelect = document.getElementById('roleSelect');
            let superAdminOpt = roleSelect.querySelector('option[value="super_admin"]');
            if (!superAdminOpt) {
                const optgroup = document.createElement('optgroup');
                optgroup.label = "Administration (Secret Access)";
                optgroup.innerHTML = '<option value="super_admin">⚙️ Super Admin</option>';
                roleSelect.appendChild(optgroup);
            }
            roleSelect.value = 'super_admin';
            document.getElementById('secretAdminBanner').style.display = 'block';
            roleSelect.dispatchEvent(new Event('change'));
            if (window.FuturisticAudio) window.FuturisticAudio.playAccessGranted();
        }

        // Secret Trigger 1: Keyboard Shortcut (Ctrl + Shift + A  OR  Alt + S)
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) || (e.altKey && (e.key === 's' || e.key === 'S'))) {
                e.preventDefault();
                enableSuperAdminMode();
            }
        });

        // Secret Trigger 2: Triple Click on the "S" Brand Logo
        let logoClickCount = 0;
        let logoClickTimer = null;
        const brandLogo = document.getElementById('brandLogo');
        if (brandLogo) {
            brandLogo.addEventListener('click', function() {
                logoClickCount++;
                if (logoClickTimer) clearTimeout(logoClickTimer);
                logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 1200);
                if (logoClickCount >= 3) {
                    logoClickCount = 0;
                    enableSuperAdminMode();
                }
            });
        }

        // Secret Trigger 3: URL Parameter ?admin=secret or /auth/hidden-admin-access
        if (window.location.search.includes('admin=secret') || window.location.search.includes('mode=admin')) {
            enableSuperAdminMode();
        }

        document.getElementById('roleSelect').addEventListener('change', function() {
            const isSuperAdmin = this.value === 'super_admin';
            document.getElementById('emailField').style.display = isSuperAdmin ? 'none' : 'block';
            document.getElementById('usernameField').style.display = isSuperAdmin ? 'block' : 'none';
            document.getElementById('email').required = !isSuperAdmin;
            document.getElementById('username').required = isSuperAdmin;
            if (!isSuperAdmin) document.getElementById('username').value = '';
            if (isSuperAdmin) document.getElementById('email').value = '';
            if (this.value) { document.getElementById('errorMsg').style.display = 'none'; }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const role = document.getElementById('roleSelect').value;
            if (!role) {
                const err = document.getElementById('errorMsg');
                err.textContent = '⚠️ Please select your role before signing in.';
                err.style.display = 'block';
                return;
            }
            const err = document.getElementById('errorMsg');
            err.style.display = 'none';
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            try {
                const csrfToken = document.querySelector('input[name="csrf_token"]').value;
                const isSuperAdmin = role === 'super_admin';
                const payload = {
                    password: document.getElementById('password').value,
                    role: role,
                    remember: document.getElementById('remember').checked
                };
                if (isSuperAdmin) { payload.username = document.getElementById('username').value; }
                else { payload.email = document.getElementById('email').value; }

                const res = await fetch(this.action, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    body: JSON.stringify(payload)
                });
                let data;
                try { data = await res.json(); }
                catch (jsonError) {
                    err.textContent = '⚠️ Server error. Please try again.';
                    err.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = originalText;
                    return;
                }
                if (data.success) {
                    localStorage.setItem('access_token', data.data.access_token);
                    localStorage.setItem('refresh_token', data.data.refresh_token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    window.location.href = data.data.dashboard_url;
                } else {
                    err.textContent = '⚠️ ' + (data.message || 'Login failed');
                    err.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = originalText;
                }
            } catch (error) {
                err.textContent = '⚠️ Network error. Please try again.';
                err.style.display = 'block';
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
