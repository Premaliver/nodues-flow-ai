<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} — {{ title }} | Smart NoDues AI</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="floating-shapes">
        <div class="floating-shape floating-shape-1"></div>
        <div class="floating-shape floating-shape-3"></div>
        <div class="floating-shape floating-shape-5"></div>
    </div>

    <div class="error-page">
        <div class="card" style="max-width: 500px; width: 100%; text-align: center; padding: 3rem 2.5rem; box-shadow: var(--shadow-xl);">
            <div style="font-size: 5rem; font-weight: 400; font-family: 'DM Serif Display', serif; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; margin-bottom: 1rem;">{{ code }}</div>
            <h1 style="font-family: 'DM Serif Display', serif; font-size: 1.5rem; font-weight: 400; margin-bottom: 0.75rem;">{{ title }}</h1>
            <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem;">{{ message }}</p>
            <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
                <a href="javascript:history.back()" class="btn btn-secondary">← Go Back</a>
                <a href="/" class="btn btn-primary">🏠 Home</a>
                <a href="/auth/login" class="btn btn-ghost">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
